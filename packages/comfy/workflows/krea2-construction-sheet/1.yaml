schema: brainforge.comfy-workflow.v2
id: krea2-construction-sheet
version: 1
description: >
  Opt-in construction-sheet variant of krea2-variation: Krea 2 Turbo + krea2_identity_edit_v1_2 LoRA
  + Krea2 Character Design 4-View LoRA (both weight 1) via Krea2EditModelPatch. One uploaded reference
  conditions the latent path and grounded text encoders; followed by explicit BiRefNet matting.

graph:
  '1':
    class_type: UNETLoader
    inputs: { unet_name: krea2_turbo_fp8_scaled.safetensors, weight_dtype: default }
  '2':
    class_type: CLIPLoader
    inputs: { clip_name: qwen3vl_4b_fp8_scaled.safetensors, type: krea2 }
  '3':
    class_type: VAELoader
    inputs: { vae_name: qwen_image_vae.safetensors }
  '4':
    class_type: LoraLoaderModelOnly
    inputs: { model: ['1', 0], lora_name: krea2_identity_edit_v1_2.safetensors, strength_model: 1.0 }
  '5':
    class_type: LoadImage
    inputs: { image: '' }
  '6':
    class_type: VAEEncode
    inputs: { pixels: ['5', 0], vae: ['3', 0] }
  # The one target latent feeds both the patch and the sampler.
  '7':
    class_type: EmptySD3LatentImage
    inputs: { width: 1024, height: 1024, batch_size: 1 }
  '8':
    class_type: Krea2EditModelPatch
    inputs:
      model: ['19', 0]
      source_latent: ['6', 0]
      target_latent: ['7', 0]
      source_image: ['5', 0]
      vae: ['3', 0]
      fit_mode: fit
      ref_boost: 4
  '9':
    class_type: Krea2EditGroundedEncode
    inputs: { clip: ['2', 0], prompt: '', image: ['5', 0], grounding_px: 768 }
  # Empty-instruction grounded encode of the same image is the negative input (not a user dial).
  '10':
    class_type: Krea2EditGroundedEncode
    inputs: { clip: ['2', 0], prompt: '', image: ['5', 0], grounding_px: 768 }
  '11':
    class_type: KSampler
    inputs:
      seed: 0
      steps: 8
      cfg: 1
      sampler_name: euler
      scheduler: simple
      denoise: 1
      model: ['8', 0]
      positive: ['9', 0]
      negative: ['10', 0]
      latent_image: ['7', 0]
  '12':
    class_type: VAEDecode
    inputs: { samples: ['11', 0], vae: ['3', 0] }
  '13':
    class_type: SaveImage
    inputs: { filename_prefix: brainforge/krea2-construction-sheet/untouched, images: ['12', 0] }
  '14':
    class_type: LoadBackgroundRemovalModel
    inputs: { bg_removal_name: birefnet.safetensors }
  '15':
    class_type: RemoveBackground
    inputs: { bg_removal_model: ['14', 0], image: ['12', 0] }
  '16':
    class_type: InvertMask
    inputs: { mask: ['15', 0] }
  '17':
    class_type: JoinImageWithAlpha
    inputs: { image: ['12', 0], alpha: ['16', 0] }
  '18':
    class_type: SaveImage
    inputs: { filename_prefix: brainforge/krea2-construction-sheet/matted, images: ['17', 0] }
  '19':
    class_type: LoraLoaderModelOnly
    inputs: { model: ['4', 0], lora_name: Krea2_Character_Design_4-View_V1.safetensors, strength_model: 1.0 }

inputBindings:
  - { name: prompt, nodeId: '9', field: prompt, type: string, required: true }
  - { name: reference, nodeId: '5', field: image, type: image, required: true }
  - { name: width, nodeId: '7', field: width, type: integer, required: true, min: 256, max: 2048, step: 16 }
  - { name: height, nodeId: '7', field: height, type: integer, required: true, min: 256, max: 2048, step: 16 }
  - { name: seed, nodeId: '11', field: seed, type: seed }
  - { name: ref_boost, nodeId: '8', field: ref_boost, type: number, min: 0, max: 20 }
  - name: grounding_px
    nodeId: '9'
    field: grounding_px
    type: integer
    min: 256
    max: 2048
    step: 64
    alsoTo: [{ nodeId: '10', field: grounding_px }]

outputBindings:
  - { role: untouched, nodeId: '13', kind: still }
  - { role: matted, nodeId: '18', kind: still }

requiredNodes: [UNETLoader, CLIPLoader, VAELoader, LoraLoaderModelOnly, LoadImage, VAEEncode, EmptySD3LatentImage, Krea2EditModelPatch, Krea2EditGroundedEncode, KSampler, VAEDecode, SaveImage, LoadBackgroundRemovalModel, RemoveBackground, InvertMask, JoinImageWithAlpha]

requiredModels:
  - { nodeId: '1', field: unet_name, filename: krea2_turbo_fp8_scaled.safetensors }
  - { nodeId: '2', field: clip_name, filename: qwen3vl_4b_fp8_scaled.safetensors }
  - { nodeId: '3', field: vae_name, filename: qwen_image_vae.safetensors }
  - { nodeId: '4', field: lora_name, filename: krea2_identity_edit_v1_2.safetensors }
  - { nodeId: '19', field: lora_name, filename: Krea2_Character_Design_4-View_V1.safetensors }
  - { nodeId: '14', field: bg_removal_name, filename: birefnet.safetensors }

execution:
  computeLocation: "Remote ComfyUI server at BF_COMFY_URL (reported by /system_stats; reachability does not imply the work runs on this machine)"
  externalServices: []
  credentialKeys: []
  costDescription: "Uses the user's own ComfyUI GPU host; no per-run fee is reported by the server. Hosting or electricity cost is unknown to Brainforge."

notes:
  - "Recipe follows https://huggingface.co/conradlocke/krea2-identity-edit and https://github.com/lbouaraba/comfyui-krea2edit; their claims are not visual proof for Cortex."
  - "Custom-node source revision of comfyui-krea2edit: unavailable (not reported by the server). Model-file integrity unverified."
  - "Reference must be flattened onto light grey before upload; RGBA would be dropped by LoadImage onto black."
  - "Four-view LoRA pinned: Civitai version 3325168, weight 1 (author recommendation), download https://civitai.com/api/download/models/3325168?fileId=3210911 , SHA256 2A77C05E1A3E1BE7C02CCB74C4D750198D968C942526ACEF5D8DA035F93A54CE. Stacked after krea2_identity_edit_v1_2 and before Krea2EditModelPatch."
  - "Live Cortex test 2026-10-01: LoRA hash verified; cand-030c259934 completed at 2048x1024 with front/profile/rear bodies and a wider face close-up. Front remains three-quarter; equal-width crops cross subjects. Baseline cand-93107344a6 returned five bodies with no close-up. Different seeds, one pair only; neither approved."
