schema: brainforge.comfy-workflow.v2
id: krea2-quadview
version: 1
description: >
  Opt-in QuadView test variant of krea2-variation: Krea 2 Turbo + QuadView_krea2_v1 LoRA (weight 1,
  the only adapter) via Krea2EditModelPatch, following the author's CharacterSheet workflow. One
  uploaded reference conditions the latent path and grounded text encoders; followed by explicit
  BiRefNet matting.

graph:
  '1':
    class_type: UNETLoader
    inputs: { unet_name: krea2_turbo_fp8_scaled.safetensors, weight_dtype: default }
  '2':
    class_type: CLIPLoader
    inputs: { clip_name: qwen3vl_4b_fp8_scaled.safetensors, type: krea2 }
  '3':
    class_type: VAELoader
    inputs: { vae_name: qwen_image_vae.safetensors }
  '4':
    class_type: LoraLoaderModelOnly
    inputs: { model: ['1', 0], lora_name: QuadView_krea2_v1.safetensors, strength_model: 1.0 }
  '5':
    class_type: LoadImage
    inputs: { image: '' }
  '6':
    class_type: VAEEncode
    inputs: { pixels: ['5', 0], vae: ['3', 0] }
  # The one target latent feeds both the patch and the sampler.
  '7':
    class_type: EmptySD3LatentImage
    inputs: { width: 1536, height: 1024, batch_size: 1 }
  '8':
    class_type: Krea2EditModelPatch
    inputs:
      model: ['4', 0]
      source_latent: ['6', 0]
      target_latent: ['7', 0]
      source_image: ['5', 0]
      vae: ['3', 0]
      fit_mode: fit
      ref_boost: 1
  # Author workflow: positive grounding_px 0, negative 768.
  '9':
    class_type: Krea2EditGroundedEncode
    inputs: { clip: ['2', 0], prompt: '', image: ['5', 0], grounding_px: 0 }
  '10':
    class_type: Krea2EditGroundedEncode
    inputs: { clip: ['2', 0], prompt: '', image: ['5', 0], grounding_px: 768 }
  '11':
    class_type: KSampler
    inputs:
      seed: 0
      steps: 10
      cfg: 1
      sampler_name: euler
      scheduler: simple
      denoise: 1
      model: ['8', 0]
      positive: ['9', 0]
      negative: ['10', 0]
      latent_image: ['7', 0]
  '12':
    class_type: VAEDecode
    inputs: { samples: ['11', 0], vae: ['3', 0] }
  '13':
    class_type: SaveImage
    inputs: { filename_prefix: brainforge/krea2-quadview/untouched, images: ['12', 0] }
  '14':
    class_type: LoadBackgroundRemovalModel
    inputs: { bg_removal_name: birefnet.safetensors }
  '15':
    class_type: RemoveBackground
    inputs: { bg_removal_model: ['14', 0], image: ['12', 0] }
  '16':
    class_type: InvertMask
    inputs: { mask: ['15', 0] }
  '17':
    class_type: JoinImageWithAlpha
    inputs: { image: ['12', 0], alpha: ['16', 0] }
  '18':
    class_type: SaveImage
    inputs: { filename_prefix: brainforge/krea2-quadview/matted, images: ['17', 0] }

inputBindings:
  - { name: prompt, nodeId: '9', field: prompt, type: string, required: true }
  - { name: reference, nodeId: '5', field: image, type: image, required: true }
  - { name: width, nodeId: '7', field: width, type: integer, required: true, min: 256, max: 2048, step: 16 }
  - { name: height, nodeId: '7', field: height, type: integer, required: true, min: 256, max: 2048, step: 16 }
  - { name: seed, nodeId: '11', field: seed, type: seed }
  - { name: ref_boost, nodeId: '8', field: ref_boost, type: number, min: 0, max: 20 }
  - { name: grounding_px, nodeId: '9', field: grounding_px, type: integer, min: 0, max: 4096, step: 64 }

outputBindings:
  - { role: untouched, nodeId: '13', kind: still }
  - { role: matted, nodeId: '18', kind: still }

requiredNodes: [UNETLoader, CLIPLoader, VAELoader, LoraLoaderModelOnly, LoadImage, VAEEncode, EmptySD3LatentImage, Krea2EditModelPatch, Krea2EditGroundedEncode, KSampler, VAEDecode, SaveImage, LoadBackgroundRemovalModel, RemoveBackground, InvertMask, JoinImageWithAlpha]

requiredModels:
  - { nodeId: '1', field: unet_name, filename: krea2_turbo_fp8_scaled.safetensors }
  - { nodeId: '2', field: clip_name, filename: qwen3vl_4b_fp8_scaled.safetensors }
  - { nodeId: '3', field: vae_name, filename: qwen_image_vae.safetensors }
  - { nodeId: '4', field: lora_name, filename: QuadView_krea2_v1.safetensors }
  - { nodeId: '14', field: bg_removal_name, filename: birefnet.safetensors }

execution:
  computeLocation: "Remote ComfyUI server at BF_COMFY_URL (reported by /system_stats; reachability does not imply the work runs on this machine)"
  externalServices: []
  credentialKeys: []
  costDescription: "Uses the user's own ComfyUI GPU host; no per-run fee is reported by the server. Hosting or electricity cost is unknown to Brainforge."

notes:
  - "Recipe follows the author workflow https://huggingface.co/Alissonerdx/CharacterSheet/raw/main/workflows/QuadView_krea2_v1.json : QuadView adapter only, weight 1, before Krea2EditModelPatch; euler/simple, 10 steps, cfg 1, ref_boost 1, 1536x1024, positive grounding_px 0, negative 768. No identity-edit or other sheet LoRA is stacked."
  - "QuadView_krea2_v1.safetensors SHA256 9435005af21cadaed16f79ef1eca9b76b8497789644eeb7f2475b826bb480fbc matches Hugging Face Alissonerdx/CharacterSheet."
  - "Trigger instruction (use as prompt): 'Convert the character in the image to a Character Sheet showing a face close-up, front full body, side full body and back full body views'."
  - "Keep the source identity reference as the uploaded reference image."
  - "Reference must be flattened onto light grey before upload; RGBA would be dropped by LoadImage onto black."
  - "Custom-node source revision of comfyui-krea2edit: unavailable (not reported by the server)."
  - "Live Cortex test 2026-10-01: cand-d7fda35b73, seed 1541969294, completed with face/front/profile/rear layout. Introduced ears and thick eyebrows, reduced the relative brain size and lengthened the body; the front remains three-quarter. No approval or default switch. One sample with author-oriented settings, not a controlled comparison against the other sheet adapter."
  - "Prompt diagnosis: cand-d7fda35b73 used correct adapter/reference wiring but was contaminated by concept description, identity and style prose. The shared reference-sheet composer now omits those fields. Corrected cand-5263b2959d (seed 455435835) removed added ears/eyebrows and produced a square-on front body; proportions/crops remain unapproved. Actual submitted graph changed only prompt and seed. Do not infer model limitations from the contaminated run."
